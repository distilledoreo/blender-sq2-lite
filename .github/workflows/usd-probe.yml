name: usd-probe

# Temporary diagnostic: the bf_usd objects fail inside USD's own
# pxr/usd/sdf/tokens.h with _TF_PP_IFF_/TF_PP_CAT expansion errors. Compile one
# trivial translation unit against the arm64 USD headers under several flag
# combinations to find which one the conforming preprocessor accepts.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-11-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch USD and Boost headers only
        shell: pwsh
        run: |
          git clone --filter=blob:none --no-checkout --depth 1 -b blender-v4.2-release https://projects.blender.org/blender/lib-windows_arm64.git C:\lib
          git -C C:\lib sparse-checkout init --cone
          git -C C:\lib sparse-checkout set usd/include boost/include tbb/include
          git -C C:\lib checkout
          Get-ChildItem C:\lib\usd\include | Select-Object -First 5 Name

      - name: Compile probe under variant flags
        shell: cmd
        run: |
          set "SRC=%GITHUB_WORKSPACE%\probe_usd.cc"
          > "%SRC%" echo #include ^<pxr/usd/sdf/tokens.h^>
          >> "%SRC%" echo int main() { return 0; }
          for /f "usebackq delims=" %%i in (`vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath`) do set "VSPATH=%%i"
          call "%VSPATH%\VC\Auxiliary\Build\vcvarsall.bat" arm64
          set "INC=/external:I C:\lib\usd\include /external:I C:\lib\boost\include /external:I C:\lib\tbb\include /external:W0"
          echo === A: /Zc:preprocessor /permissive- /std:c++17
          cl /nologo /Zs /TP %INC% /Zc:preprocessor /permissive- /std:c++17 "%SRC%" > nul 2>&1
          echo A exit=%ERRORLEVEL%
          echo === B: /Zc:preprocessor /std:c++17 (no /permissive-)
          cl /nologo /Zs /TP %INC% /Zc:preprocessor /std:c++17 "%SRC%" > nul 2>&1
          echo B exit=%ERRORLEVEL%
          echo === C: traditional preprocessor
          cl /nologo /Zs /TP %INC% /Zc:preprocessor- /permissive- /std:c++17 "%SRC%" > nul 2>&1
          echo C exit=%ERRORLEVEL%
          echo === D: /Zc:preprocessor /permissive- /std:c++17 /J
          cl /nologo /Zs /TP %INC% /Zc:preprocessor /permissive- /std:c++17 /J "%SRC%" > nul 2>&1
          echo D exit=%ERRORLEVEL%
          echo === E: /Zc:preprocessor, no /std flag (default c++14)
          cl /nologo /Zs /TP %INC% /Zc:preprocessor "%SRC%" > nul 2>&1
          echo E exit=%ERRORLEVEL%
          echo === F: details for the strictest variant
          cl /nologo /Zs /TP %INC% /Zc:preprocessor /permissive- /std:c++17 "%SRC%" 2>&1 | findstr /C:"error" | more +0
          exit /b 0
