name: agility-probe-arm64
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'mesa-test/agility_probe.c'
      - '.github/workflows/agility-probe.yml'

jobs:
  probe:
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64
      - name: Compile agility_probe (MSVC ARM64)
        shell: cmd
        run: |
          cl /nologo /O2 /W2 mesa-test\agility_probe.c /link /out:agility_probe.exe /subsystem:console opengl32.lib gdi32.lib user32.lib
          dumpbin /exports agility_probe.exe | findstr D3D12SDK
          dir agility_probe.exe
      - uses: actions/upload-artifact@v4
        with:
          name: agility-probe-arm64
          path: agility_probe.exe
          retention-days: 7
