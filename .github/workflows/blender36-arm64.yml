name: blender36-arm64-lite

# Attempts a native Windows-ARM64 build of Blender 3.6 (lite: no Cycles/USD/
# Alembic/OIDN/FFmpeg/OpenVDB/OpenSubdiv). 3.6 has no arm64 dependency set of
# its own, so the 4.2 arm64 libs are used and ARM64 CPython 3.10 is injected at
# lib/windows_arm64/python/310 in the layout 3.6 expects.
#
# Iteration log: every round reports the first real failure; see
# docs/BLENDER36_ARM64.md section 5 for the plan.

on:
  workflow_dispatch:
    inputs:
      blender_ref:
        description: "Blender git ref (tag/branch) to build"
        default: "v3.6.23"
        required: true
      configure_only:
        description: "Stop after the CMake configure step"
        type: boolean
        default: false

jobs:
  lite:
    # Native ARM64 runner, same image the 5.2 arm64 build uses.
    runs-on: windows-11-arm
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Toolchain check
        shell: pwsh
        run: |
          vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
          cmake --version | Select-Object -First 1
          ninja --version
          $env:PROCESSOR_ARCHITECTURE

      - name: Clone Blender 3.6 source
        shell: pwsh
        run: |
          git clone --depth 1 -b "${{ inputs.blender_ref }}" https://projects.blender.org/blender/blender.git C:\b
          git -C C:\b log --oneline -1

      - name: Fetch arm64 dependency set (4.2 branch)
        shell: pwsh
        run: |
          git clone --depth 1 -b blender-v4.2-release https://projects.blender.org/blender/lib-windows_arm64.git C:\b\lib\windows_arm64
          if (-not (Test-Path C:\b\lib\windows_arm64\.git)) { throw "libdir has no .git, 3.6 rejects it" }
          Get-ChildItem C:\b\lib\windows_arm64 | Select-Object -First 40 Name

      - name: Inject ARM64 Python 3.10 (3.6 pins 3.10)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pkg = "$env:RUNNER_TEMP\pythonarm64.zip"
          curl.exe -sSL -o $pkg https://www.nuget.org/api/v2/package/pythonarm64/3.10.11
          Expand-Archive -Path $pkg -DestinationPath "$env:RUNNER_TEMP\py310" -Force
          $t = "$env:RUNNER_TEMP\py310\tools"
          Get-ChildItem $t | Select-Object Name
          $dst = "C:\b\lib\windows_arm64\python\310"
          New-Item -ItemType Directory -Force "$dst\bin", "$dst\include", "$dst\libs", "$dst\lib\site-packages" | Out-Null
          Copy-Item "$t\python.exe", "$t\python310.dll", "$t\python3.dll" "$dst\bin\" -Force
          Copy-Item "$t\DLLs" "$dst\bin\DLLs" -Recurse -Force
          Copy-Item "$t\Lib" "$dst\bin\Lib" -Recurse -Force
          Copy-Item "$t\include\*" "$dst\include\" -Recurse -Force
          Copy-Item "$t\libs\*" "$dst\libs\" -Recurse -Force
          Get-ChildItem "$dst\libs", "$dst\include" | Select-Object -First 12 Name
          & "$dst\bin\python.exe" -c "import sys; print('python', sys.version, sys.platform)"

      - name: Apply Windows-ARM64 build-system patch
        shell: pwsh
        run: |
          git -C C:\b apply --verbose "$env:GITHUB_WORKSPACE\custom-driver\blender36\0001-windows-arm64-build-support.patch"
          Select-String -Path C:\b\build_files\cmake\platform\platform_win32.cmake -Pattern "windows_arm64|MACHINE:ARM64|Zc:preprocessor"

      - name: Configure (lite)
        shell: pwsh
        run: |
          cmake -S C:\b -B C:\b\build -G "Visual Studio 17 2022" -A ARM64 `
            -DWITH_CYCLES=OFF -DWITH_USD=OFF -DWITH_ALEMBIC=OFF `
            -DWITH_OPENIMAGEDENOISE=OFF -DWITH_FFMPEG=OFF -DWITH_OPENVDB=OFF `
            -DWITH_OPENSUBDIV=OFF -DWITH_COLLADA=OFF -DWITH_POTRACE=OFF `
            -DWITH_BOOST=OFF -DWITH_HYDRA=OFF -DWITH_XR_OPENXR=OFF `
            -DWITH_OPENCOLLADA=OFF `
            -DWITH_PYTHON_INSTALL=OFF -DWITH_WINDOWS_FIND_MODULES=OFF 2>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) { tail -80 configure.log; throw "configure failed" }
          Select-String -Path C:\b\build\CMakeCache.txt -Pattern "LIBDIR_BASE|CMAKE_SYSTEM_PROCESSOR|PYTHON_LIBRARY:|PYTHON_EXECUTABLE:"

      - name: Upload configure log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: configure-log
          path: configure.log
          retention-days: 7

      - name: Build (lite)
        if: ${{ !inputs.configure_only }}
        shell: pwsh
        run: |
          cmake --build C:\b\build --config Release -- /m /v:m 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "===== first errors ====="
            Select-String -Path build.log -Pattern "error [A-Z]+[0-9]+|fatal error" | Select-Object -First 40
            throw "build failed"
          }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
