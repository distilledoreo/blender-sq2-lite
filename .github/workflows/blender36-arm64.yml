name: blender36-arm64

# Native Windows-ARM64 build of Blender 3.6.
#
# `features: full` (the default) enables Cycles, USD, Alembic, OpenVDB,
# OpenSubdiv, OpenImageDenoise, Collada, Potrace, Boost, OpenXR and FFmpeg.
# `features: lite` reproduces the original EEVEE/Workbench-only build, kept so a
# regression can be bisected against a known-good configuration.
#
# 3.6 has no arm64 dependency set of its own, so the 4.2 arm64 libs are used and
# ARM64 CPython 3.10 is injected at lib/windows_arm64/python/310 in the layout
# 3.6 expects. numpy, for which no arm64 wheel exists, is compiled from source.
#
# Configure/build run through custom-driver/blender36/ci_*_arm64.bat, which set
# up vcvarsall arm64 and use the Ninja generator: the "Visual Studio 17 2022"
# generator cannot find a VS instance on this runner.
#
# Iteration log: each round reports the first real failure; plan is in
# docs/BLENDER36_ARM64.md section 5.

on:
  workflow_dispatch:
    inputs:
      blender_ref:
        description: "Blender git ref (tag/branch) to build"
        default: "v3.6.23"
        required: true
      features:
        description: "Feature set: full or lite"
        default: "full"
        required: true
      configure_only:
        description: "Stop after the CMake configure step"
        type: boolean
        default: false

jobs:
  lite:
    runs-on: windows-11-arm
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Toolchain diagnostics
        shell: pwsh
        run: |
          Write-Host "ARCH=$env:PROCESSOR_ARCHITECTURE"
          vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
          cmake --version | Select-Object -First 1
          ninja --version

      - name: Clone Blender 3.6 source
        shell: pwsh
        run: |
          # projects.blender.org occasionally resets the connection; retry so a
          # flaky clone does not waste a full build round.
          foreach ($attempt in 1..3) {
            if (Test-Path C:\b) { Remove-Item -Recurse -Force C:\b }
            git clone --depth 1 -b "${{ inputs.blender_ref }}" https://projects.blender.org/blender/blender.git C:\b
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { throw "blender clone failed after 3 attempts" }
            Write-Host "clone attempt $attempt failed, retrying"
            Start-Sleep -Seconds 20
          }
          git -C C:\b log --oneline -1

      - name: Fetch arm64 dependency set (4.2 branch)
        shell: pwsh
        run: |
          foreach ($attempt in 1..3) {
            if (Test-Path C:\b\lib\windows_arm64) { Remove-Item -Recurse -Force C:\b\lib\windows_arm64 }
            git clone --depth 1 -b blender-v4.2-release https://projects.blender.org/blender/lib-windows_arm64.git C:\b\lib\windows_arm64
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { throw "lib clone failed after 3 attempts" }
            Write-Host "lib clone attempt $attempt failed, retrying"
            Start-Sleep -Seconds 20
          }
          if (-not (Test-Path C:\b\lib\windows_arm64\.git)) { throw "libdir has no .git, 3.6 rejects it" }
          Get-ChildItem C:\b\lib\windows_arm64 | Select-Object -First 40 Name

      # 3.6's source tree has no scripts/addons: the release process clones
      # blender-addons there (make_update.py does the same), so a plain clone
      # builds a Blender whose Python cannot even enable its own add-ons.
      - name: Clone add-ons (blender-addons v3.6.23)
        shell: pwsh
        run: |
          foreach ($attempt in 1..3) {
            if (Test-Path C:\b\scripts\addons) { Remove-Item -Recurse -Force C:\b\scripts\addons }
            git clone --depth 1 -b v3.6.23 https://projects.blender.org/blender/blender-addons.git C:\b\scripts\addons
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { throw "addons clone failed after 3 attempts" }
            Write-Host "addons clone attempt $attempt failed, retrying"
            Start-Sleep -Seconds 20
          }
          Write-Host "add-on packages: $((Get-ChildItem C:\b\scripts\addons -Directory).Count)"

      - name: Inject ARM64 Python 3.10 (3.6 pins 3.10)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pkg = "$env:RUNNER_TEMP\pythonarm64.zip"
          curl.exe -sSL -o $pkg https://www.nuget.org/api/v2/package/pythonarm64/3.10.11
          Expand-Archive -Path $pkg -DestinationPath "$env:RUNNER_TEMP\py310" -Force
          $t = "$env:RUNNER_TEMP\py310\tools"
          $dst = "C:\b\lib\windows_arm64\python\310"
          New-Item -ItemType Directory -Force "$dst\bin", "$dst\include", "$dst\libs", "$dst\lib\site-packages" | Out-Null
          # Layout must match the 3.6 lib set, because creator/CMakeLists.txt
          # installs python/310/lib as <ver>/python/lib (the stdlib) and reads
          # DLLs and bin/python.exe from the same paths. The nuget package
          # calls them Lib and keeps the runtime DLLs loose; neither is what
          # the install rules look for.
          Copy-Item "$t\python.exe", "$t\python310.dll", "$t\python3.dll" "$dst\bin\" -Force
          Copy-Item "$t\vcruntime140.dll", "$t\vcruntime140_1.dll" "$dst\bin\" -Force
          Copy-Item "$t\DLLs" "$dst\DLLs" -Recurse -Force
          Copy-Item "$t\Lib\*" "$dst\lib\" -Recurse -Force
          Copy-Item "$t\include\*" "$dst\include\" -Recurse -Force
          Copy-Item "$t\libs\*" "$dst\libs\" -Recurse -Force
          & "$dst\bin\python.exe" -c "import sys; print('python', sys.version, sys.platform)"
          Write-Host "python310.lib present: $(Test-Path "$dst\libs\python310.lib")"
          # numpy has no win_arm64/cp310 wheel, so it is compiled from source in
          # the next step; that build also provides the numpy/core/include
          # headers audaspace needs at compile time.

      # numpy ships no win_arm64/cp310 wheel for 1.26 (the last release line 3.6
      # supports), so the sdist is compiled with the same ARM64 toolchain as
      # Blender. A headers-only numpy is worse than none: `import numpy` then
      # succeeds as an empty namespace package and FBX/glTF export fails with
      # "module 'numpy' has no attribute 'single'" (measured on round 20).
      - name: Build numpy for ARM64 Python 3.10
        shell: pwsh
        run: |
          cmd /c "$env:GITHUB_WORKSPACE\custom-driver\blender36\ci_numpy_arm64.bat" C:\b 2>&1 | Tee-Object -FilePath numpy.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "===== numpy build tail ====="
            Get-Content numpy.log -Tail 60 | ForEach-Object { Write-Host $_ }
            throw "numpy build failed"
          }

      - name: Apply Windows-ARM64 patches
        shell: pwsh
        run: |
          Get-ChildItem "$env:GITHUB_WORKSPACE\custom-driver\blender36\*.patch" | Sort-Object Name | ForEach-Object {
            Write-Host "applying $($_.Name)"
            git -C C:\b apply --verbose $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "patch failed: $($_.Name)" }
          }
          Select-String -Path C:\b\build_files\cmake\platform\platform_win32.cmake -Pattern "windows_arm64|MACHINE:ARM64|Zc:preprocessor" | ForEach-Object { $_.Line.Trim() }

      - name: Configure (${{ inputs.features }}, Ninja + arm64 MSVC)
        shell: pwsh
        run: |
          cmd /c "$env:GITHUB_WORKSPACE\custom-driver\blender36\ci_configure_arm64.bat" C:\b ${{ inputs.features }} 2>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) { Write-Host "=== configure failed ==="; throw "configure failed" }
          Select-String -Path C:\b\build\CMakeCache.txt -Pattern "LIBDIR_BASE|CMAKE_SYSTEM_PROCESSOR:|PYTHON_LIBRARY:|PYTHON_EXECUTABLE:" | ForEach-Object { $_.Line }

      - name: Upload configure log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: configure-log
          path: configure.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Build
        if: ${{ !inputs.configure_only }}
        shell: pwsh
        run: |
          cmd /c "$env:GITHUB_WORKSPACE\custom-driver\blender36\ci_build_arm64.bat" C:\b 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "===== first errors ====="
            Select-String -Path build.log -Pattern "error [A-Z]+[0-9]+|fatal error" | Select-Object -First 40 | ForEach-Object { $_.Line }
            throw "build failed"
          }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Locate blender.exe
        if: ${{ !inputs.configure_only && success() }}
        shell: pwsh
        run: |
          Get-ChildItem C:\b\build -Recurse -Filter blender.exe | Select-Object FullName, Length
          $exe = "C:\b\build\bin\blender.exe"
          if (-not (Test-Path $exe)) { throw "blender.exe missing at $exe" }
          # PE header check: a native ARM64 image reports machine 0xAA64, a
          # cross-built x64 one would report 0x8664.
          $fs = [IO.File]::OpenRead($exe)
          $br = New-Object IO.BinaryReader($fs)
          $fs.Position = 0x3C
          $peOffset = $br.ReadInt32()
          $fs.Position = $peOffset + 4
          $machine = $br.ReadUInt16()
          $br.Dispose()
          Write-Host ("PE machine: 0x{0:X4} (ARM64 is 0xAA64)" -f $machine)
          if ($machine -ne 0xAA64) { throw "blender.exe is not an ARM64 PE image" }

      - name: Stage runtime tree and smoke test
        if: ${{ !inputs.configure_only && success() }}
        shell: pwsh
        run: |
          # Assemble build\bin into a runnable tree (scripts, add-ons, datafiles
          # and the bundled Python). The checks below fail the step if any of
          # those did not land, so a partial install cannot be uploaded.
          cmake --install C:\b\build
          # Install stops at the first `install(FILES ...)` whose source is
          # missing (3.6 names 3.x-era DLLs) and silently skips every later
          # rule; the checks at the end of this step are what catch that.
          if ($LASTEXITCODE -ne 0) { Write-Host "install reported $LASTEXITCODE (non-fatal), staging build\bin as-is; rules after the failure did not run" }

          # blender.exe declares a side-by-side dependency on the `blender.shared`
          # assembly, so the folder needs its manifest or the exe dies with
          # "side-by-side configuration is incorrect". Install writes it last;
          # regenerate it from what actually landed if install stopped early.
          $sharedManifest = "C:\b\build\bin\blender.shared\blender.shared.manifest"
          if ((Test-Path "C:\b\build\bin\blender.shared") -and -not (Test-Path $sharedManifest)) {
            $files = @(Get-ChildItem "C:\b\build\bin\blender.shared" -File -Filter *.dll)
            if ($files.Count -gt 0) {
              $entries = ($files | ForEach-Object { '    <file name="' + $_.Name + '"/>' }) -join "`n"
              $xml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' + "`n" +
                     '<assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0">' + "`n" +
                     '    <assemblyIdentity type="win32" name="blender.shared" version="1.0.0.0" />' + "`n" +
                     $entries + "`n" +
                     '</assembly>' + "`n"
              Set-Content -Path $sharedManifest -Value $xml -Encoding utf8
              Write-Host "generated blender.shared.manifest ($($files.Count) DLLs)"
            }
          }

          # 3.6's install rules name dependencies the way its own 3.x dependency
          # set did (OpenColorIO_2_2.dll, libfftw3-3.dll, ...), so against the 4.2
          # arm64 set several imported DLLs are never installed and the exe dies
          # with 0xC0000135. stage_runtime.py walks the import graph and copies
          # what is missing out of the dependency tree.
          $py = "C:\b\lib\windows_arm64\python\310\bin\python.exe"
          if (-not (Test-Path $py)) { $py = "python" }
          & $py "$env:GITHUB_WORKSPACE\custom-driver\blender36\stage_runtime.py" --tree "C:\b\build\bin" --lib "C:\b\lib\windows_arm64"
          if ($LASTEXITCODE -ne 0) { throw "staging left unresolved DLL dependencies" }

          Get-ChildItem C:\b\build\bin | Select-Object Name, Length | Format-Table -AutoSize
          # It is a console subsystem exe, but a GUI build here would not be
          # waited for by `&`, so wait explicitly and read the exit code.
          $verFile = "C:\b\build\bin\version.txt"
          $proc = Start-Process -FilePath "C:\b\build\bin\blender.exe" -ArgumentList "--version" `
            -Wait -PassThru -NoNewWindow -RedirectStandardOutput $verFile
          Get-Content $verFile
          if ($proc.ExitCode -ne 0) { throw "blender.exe --version exited $($proc.ExitCode)" }
          if (-not (Select-String -Path $verFile -Pattern "Blender 3\.6\." -Quiet)) { throw "version output missing" }
          Remove-Item $verFile -Force

          # --version never starts Python, so a tree missing python/lib (no
          # `encodings`) still exits 0. Initialise Python and use an add-on to
          # prove the install tree is actually complete.
          $checkPy = "C:\b\build\bin\pycheck.py"
          # `bpy.app.build_options` field names follow the CMake `WITH_`
          # options, and 3.6 has no `boost` field (round 39 failed on exactly
          # that), so only names listed in python/intern/bpy_app_build_options.c
          # can be probed.
          $lines = @(
            'import os, sys, tempfile',
            'import encodings  # needs python/lib (the bundled stdlib)',
            'import bpy',
            'import io_scene_fbx  # needs scripts/addons',
            'import numpy  # must be a real numpy, not a headers-only namespace package',
            "print('PYOK', sys.version.split()[0], bpy.app.version_string, io_scene_fbx.bl_info['name'])",
            "print('NUMPYOK', numpy.__version__, hasattr(numpy, 'single'), hasattr(numpy, 'lcm'))",
            'o = bpy.app.build_options',
            "print('FEATURES', ' '.join('%s=%s' % (k, getattr(o, k)) for k in ('cycles', 'usd', 'alembic', 'openvdb', 'opensubdiv', 'collada', 'potrace', 'xr_openxr', 'codec_ffmpeg', 'image_openexr', 'openmp')))",
            "bpy.context.scene.render.engine = 'CYCLES'",
            "print('CYCLESOK', bpy.context.scene.render.engine)",
            'bpy.ops.mesh.primitive_cube_add()',
            'tmp = tempfile.gettempdir()',
            'bpy.ops.preferences.addon_enable(module="io_scene_fbx")',
            'fbx = os.path.join(tmp, "arm64-smoke.fbx")',
            'bpy.ops.export_scene.fbx(filepath=fbx)',
            "print('FBXOK', os.path.getsize(fbx))",
            'os.remove(fbx)',
            'bpy.ops.preferences.addon_enable(module="io_scene_gltf2")',
            'glb = os.path.join(tmp, "arm64-smoke.glb")',
            'bpy.ops.export_scene.gltf(filepath=glb, export_format="GLB")',
            "print('GLTFOK', os.path.getsize(glb))",
            'os.remove(glb)'
          )
          Set-Content -Path $checkPy -Value $lines -Encoding ascii
          # Keep the whole output: filtering it for the markers hides the
          # traceback of an `--python-exit-code` failure, which is the only thing
          # that says why the script did not finish.
          $pyLog = "C:\b\build\bin\pycheck.log"
          & "C:\b\build\bin\blender.exe" -b --factory-startup --python-exit-code 13 --python $checkPy *> $pyLog
          $pyCode = $LASTEXITCODE
          Get-Content $pyLog | Select-String "PYOK|NUMPYOK|FEATURES|CYCLESOK|FBXOK|GLTFOK"
          if ($pyCode -ne 0) {
            # `Select-Object` output did not survive the step failure in round
            # 39, so hand the whole file to Write-Host as one value.
            Write-Host (Get-Content $pyLog -Raw)
            throw "python smoke test exited $pyCode"
          }
          Remove-Item $checkPy, $pyLog -Force -ErrorAction SilentlyContinue

          foreach ($p in "3.6\python\lib\encodings", "3.6\python\DLLs", "3.6\scripts\addons\io_scene_fbx") {
            if (-not (Test-Path (Join-Path "C:\b\build\bin" $p))) { throw "install tree is missing $p" }
          }
          # numpy 1.26 names its extensions after the ABI tag
          # (`_multiarray_umath.cp310-win_arm64.pyd`), so match the module name
          # instead of the pre-1.19 `multiarray.pyd` file name.
          $numpyExt = @(Get-ChildItem "C:\b\build\bin\3.6\python\lib\site-packages\numpy\core\_multiarray_umath*.pyd" -ErrorAction SilentlyContinue)
          if ($numpyExt.Count -lt 1) { throw "install tree is missing numpy's _multiarray_umath extension" }

          # `datafiles/icons` holds the vector icons for the tool buttons in the
          # 3D viewport toolbar (188 `.dat` files, one per `ICON_GEOM_NAMES`
          # entry). 3.6 loads them from disk at draw time, so a missing
          # directory renders every tool button as an empty square while the
          # 16 px texture icons in the headers still look fine. Round 20
          # shipped without it because `cmake --install` aborted earlier.
          $geomIcons = @(Get-ChildItem "C:\b\build\bin\3.6\datafiles\icons\*.dat" -ErrorAction SilentlyContinue)
          if ($geomIcons.Count -lt 188) { throw "3.6\datafiles\icons has $($geomIcons.Count) geometry icons, expected 188" }
          if (-not (Test-Path "C:\b\build\bin\3.6\datafiles\studiolights")) { throw "install tree is missing 3.6\datafiles\studiolights" }

      - name: Upload blender.exe
        if: ${{ !inputs.configure_only && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: blender36-${{ inputs.features }}-arm64
          path: C:\b\build\bin
          retention-days: 7
          if-no-files-found: warn
