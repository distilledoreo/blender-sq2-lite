name: mesa-sq2-d3d12
on:
  workflow_dispatch:
    inputs:
      patches:
        description: 'Which SQ2 patches to apply (none|probe|force|both)'
        required: true
        default: 'none'
  push:
    branches: [main]
    paths:
      - 'custom-driver/mesa_sq2_*.patch'
      - '.github/workflows/mesa-sq2.yml'

jobs:
  d3d12:
    runs-on: windows-11-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64
      - name: Tools (meson, ninja, flex/bison)
        shell: pwsh
        run: |
          pip install meson==1.12.1 mako==1.4.3 pyyaml==6.0.3
          choco uninstall -y winflexbison; $LASTEXITCODE = 0
          choco install -y ninja winflexbison3 --version=2.5.24.20210105
          meson --version; ninja --version; win_flex --version
      - name: Clone Mesa 26.3.0 (matches measured DLLs)
        shell: pwsh
        run: |
          git clone --depth 1 -c core.autocrlf=false -b mesa-26.3.0 https://gitlab.freedesktop.org/mesa/mesa.git C:\m
      - name: Apply SQ2 patches
        shell: pwsh
        run: |
          $files = @('custom-driver/mesa_sq2_msvc4189.patch')
          $p = '${{ inputs.patches }}'
          if (-not $p) { $p = 'none' }
          Write-Host "patches=$p"
          if ($p -eq 'probe' -or $p -eq 'force' -or $p -eq 'both') { $files += 'custom-driver/mesa_sq2_gate_probe.patch' }
          foreach ($f in $files) {
            $dst = "C:\m\" + [IO.Path]::GetFileName($f)
            Copy-Item $f $dst
            git -C C:\m apply --stat $dst; if ($LASTEXITCODE -ne 0) { Write-Host "PATCH PARSE FAILED: $f"; exit 1 }
            git -C C:\m apply --check $dst; if ($LASTEXITCODE -ne 0) { Write-Host "PATCH CHECK FAILED: $f"; exit 1 }
            git -C C:\m apply $dst; if ($LASTEXITCODE -ne 0) { Write-Host "PATCH APPLY FAILED: $f"; exit 1 }
          }
          if ($p -eq 'force' -or $p -eq 'both') {
            python custom-driver/apply_sq2_force.py C:\m\src\gallium\drivers\d3d12\d3d12_screen.cpp
            if ($LASTEXITCODE -ne 0) { Write-Host 'FORCE APPLY FAILED'; exit 1 }
          }
          git -C C:\m status --short
      - name: Configure (d3d12 only, no LLVM)
        shell: cmd
        working-directory: C:\m
        run: meson setup build --prefix="%CD%\inst" --default-library=static -Dbuildtype=release -Db_ndebug=true -Dllvm=disabled -Dplatforms=windows -Dvideo-codecs= -Dgallium-drivers=d3d12 -Dvulkan-drivers= -Dc_args="-wd4189 -wd4319" -Dcpp_args="-wd4189 -wd4319" -Degl=enabled -Dgles1=enabled -Dgles2=enabled
      - name: Build
        shell: cmd
        working-directory: C:\m
        run: ninja -C build
      - name: Collect + upload
        shell: pwsh
        run: |
          $want = @(
            'src\gallium\targets\libgl-gdi\opengl32.dll',
            'src\gallium\targets\wgl\libgallium_wgl.dll',
            'src\egl\libEGL.dll',
            'src\mesa\glapi\es2api\libGLESv2.dll',
            'src\mesa\glapi\es1api\libGLESv1_CM.dll'
          )
          New-Item -ItemType Directory -Force out | Out-Null
          foreach ($w in $want) {
            $src = Join-Path 'C:\m\build' $w
            if (!(Test-Path $src)) { Write-Host "MISSING DLL: $src"; exit 1 }
            Copy-Item $src out\
          }
          Get-ChildItem out\ | Format-Table Name, Length -AutoSize
      - uses: actions/upload-artifact@v4
        with:
          name: mesa-sq2-d3d12-${{ inputs.patches }}
          path: out/*
          retention-days: 7
