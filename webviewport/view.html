<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SQ2 Web Viewport - transforms + animation</title>
<style>
  html,body{margin:0;height:100%;background:#1a1d22;color:#ddd;font-family:Segoe UI,system-ui}
  #bar{padding:8px 12px;display:flex;gap:8px;align-items:center;background:#22262d;flex-wrap:wrap}
  #c{width:100%;height:calc(100% - 84px);display:block}
  button,select{background:#3a4150;color:#fff;border:0;padding:6px 10px;border-radius:6px;cursor:pointer}
  button.active{background:#5a7bff}
  span{opacity:.7;font-size:13px}
  #animbar{padding:6px 12px;display:flex;gap:8px;align-items:center;background:#1e2228}
  #time{flex:1}
</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="bar">
  <input type="file" id="f" accept=".glb,.gltf">
  <button id="wire">Wireframe</button>
  <button id="solid" class="active">Solid</button>
  <button id="mT">Move [W]</button>
  <button id="mR">Rotate [E]</button>
  <button id="mS">Scale [R]</button>
  <button id="save">Export transforms JSON</button>
  <span>Click object to select. Browser ANGLE/D3D = hardware-fast on SQ2.</span>
</div>
<div id="animbar">
  <button id="play">Play</button>
  <select id="clips"></select>
  <input type="range" id="time" min="0" max="1" step="0.001" value="0">
  <span id="tlabel">no animation</span>
</div>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1d22);
const cam = new THREE.PerspectiveCamera(50, 2, 0.01, 1000);
cam.position.set(3,2,4);
const ctl = new OrbitControls(cam, canvas);
scene.add(new THREE.HemisphereLight(0xffffff, 0x223344, 1.2));
const dir = new THREE.DirectionalLight(0xffffff, 2); dir.position.set(4,6,3); scene.add(dir);
scene.add(new THREE.GridHelper(10, 20, 0x444444, 0x2a2e35));

const tctl = new TransformControls(cam, renderer.domElement);
scene.add(tctl);
tctl.addEventListener('dragging-changed', e => { ctl.enabled = !e.value; });
let root=null, wire=false, mixer=null, actions={}, activeAction=null, clock=new THREE.Clock();

function fit(o){
  const b=new THREE.Box3().setFromObject(o);
  const s=b.getSize(new THREE.Vector3()).length();
  const c=b.getCenter(new THREE.Vector3());
  ctl.target.copy(c);
  cam.position.copy(c).add(new THREE.Vector3(s*0.6,s*0.45,s*0.7));
}
function setWire(v){
  wire=v;
  document.getElementById('wire').classList.toggle('active',v);
  document.getElementById('solid').classList.toggle('active',!v);
  if(!root) return;
  root.traverse(m=>{ if(m.isMesh){ m.material.wireframe=v; m.material.needsUpdate=true; }});
}
document.getElementById('wire').onclick=()=>setWire(true);
document.getElementById('solid').onclick=()=>setWire(false);
function setMode(m){
  tctl.setMode(m);
  for(const id of ['mT','mR','mS']) document.getElementById(id).classList.remove('active');
  document.getElementById(m==='translate'?'mT':m==='rotate'?'mR':'mS').classList.add('active');
}
document.getElementById('mT').onclick=()=>setMode('translate');
document.getElementById('mR').onclick=()=>setMode('rotate');
document.getElementById('mS').onclick=()=>setMode('scale');
addEventListener('keydown',e=>{
  if(e.key==='w'||e.key==='W') setMode('translate');
  if(e.key==='e'||e.key==='E') setMode('rotate');
  if(e.key==='r'||e.key==='R') setMode('scale');
  if(e.key==='Escape') tctl.detach();
});

// pick objects
const ray=new THREE.Raycaster(), ptr=new THREE.Vector2();
canvas.addEventListener('pointerdown',e=>{
  if(tctl.dragging) return;
  const r=canvas.getBoundingClientRect();
  ptr.x=((e.clientX-r.left)/r.width)*2-1;
  ptr.y=-((e.clientY-r.top)/r.height)*2+1;
  ray.setFromCamera(ptr,cam);
  const hits=ray.intersectObjects(root?root.children:[],true);
  if(hits.length){
    let o=hits[0].object;
    tctl.attach(o);
  } else tctl.detach();
});

// animations
const clipsEl=document.getElementById('clips'), timeEl=document.getElementById('time'), tlabel=document.getElementById('tlabel');
let playing=false, curClip=null, duration=0;
document.getElementById('play').onclick=e=>{
  if(!activeAction) return;
  playing=!playing;
  e.target.textContent=playing?'Pause':'Play';
  if(playing){ clock.getDelta(); activeAction.paused=false; }
  else activeAction.paused=true;
};
clipsEl.onchange=()=>{
  if(!mixer) return;
  const name=clipsEl.value;
  if(activeAction) activeAction.stop();
  activeAction=actions[name];
  curClip=activeAction.getClip();
  duration=curClip.duration;
  activeAction.reset().play();
  activeAction.paused=!playing;
  tlabel.textContent=`${name} (${duration.toFixed(2)}s)`;
};
timeEl.oninput=()=>{
  if(!activeAction||!duration) return;
  activeAction.time=parseFloat(timeEl.value)*duration;
  mixer.update(0);
};

function loadGLTF(url){
  new GLTFLoader().load(url, g=>{
    if(root) { scene.remove(root); tctl.detach(); }
    root=g.scene; scene.add(root); setWire(wire); fit(root);
    // reset anim UI
    mixer=null; actions={}; activeAction=null; clipsEl.innerHTML=''; playing=false;
    document.getElementById('play').textContent='Play';
    if(g.animations && g.animations.length){
      mixer=new THREE.AnimationMixer(root);
      g.animations.forEach(c=>{
        const a=mixer.clipAction(c); actions[c.name||`clip_${Object.keys(actions).length}`]=a;
        const o=document.createElement('option'); o.value=o.textContent=(c.name||'clip'); clipsEl.appendChild(o);
      });
      clipsEl.onchange();
      tlabel.textContent=`${g.animations.length} clip(s) loaded`;
    } else tlabel.textContent='no animation in file (export with animations checked)';
  });
}
document.getElementById('f').onchange=e=>{
  const file=e.target.files[0]; if(!file) return;
  loadGLTF(URL.createObjectURL(file));
};

// export transforms JSON -> apply back in Blender via apply_transforms.py
document.getElementById('save').onclick=()=>{
  if(!root){ alert('Load a .glb first'); return; }
  const out={};
  root.traverse(o=>{
    if(o.isMesh||o.isBone||o.isObject3D){
      if(o===root) return;
      out[o.name||o.uuid]={location:[o.position.x,o.position.y,o.position.z],
        rotation_euler:[o.rotation.x,o.rotation.y,o.rotation.z],
        scale:[o.scale.x,o.scale.y,o.scale.z]};
    }
  });
  const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='sq2_transforms.json'; a.click();
};

function resize(){
  const w=innerWidth,h=innerHeight-84;
  renderer.setSize(w,h,false); cam.aspect=w/h; cam.updateProjectionMatrix();
}
addEventListener('resize',resize); resize();
setMode('translate');
renderer.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(),0.05);
  if(mixer&&playing&&activeAction){
    mixer.update(dt);
    if(duration) timeEl.value=(activeAction.time%duration)/duration;
  }
  ctl.update(); renderer.render(scene,cam);
});
fetch('./sq2_preview.glb').then(r=>{ if(r.ok) return r.blob(); throw 0; })
  .then(b=>loadGLTF(URL.createObjectURL(b))).catch(()=>{});
</script>
</body>
</html>
